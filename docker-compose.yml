# Coolify-friendly compose for the Now Smart SOS admin backend.
# Set PORT in Coolify env (default 7474 — host 8080 is often taken).
# If Coolify proxies via Traefik and still conflicts on host binds, delete the
# `ports:` block and set the resource's "Ports Exposes" to the same PORT value.
services:
  sos-guard-server:
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-7474}
      DATA_DIR: /data
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-demo-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://1v.collab.name.ng}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "${PORT:-7474}:${PORT:-7474}"
    volumes:
      - sos-data:/data
volumes:
  sos-data:
