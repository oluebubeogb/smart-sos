# Coolify-friendly compose for the Now Smart SOS admin backend.
# In Coolify: create a "Docker Compose" resource, point at this file,
# set the env vars (see .env.example), attach a persistent volume for /data,
# and map a domain. PORT inside the container must match the published port
# Coolify/proxy routes to (set PORT=7474 and "7474:7474" if you change it).
services:
  sos-guard-server:
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      DATA_DIR: /data
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-demo-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://1v.collab.name.ng}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - sos-data:/data
volumes:
  sos-data:
