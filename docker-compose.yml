# Smart SOS — Coolify compose. Postgres is an EXTERNAL Coolify service:
# set DATABASE_URL to its internal URL. No postgres service here.
# Local dev with bundled Postgres: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  sos-guard-server:
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-7474}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: ${PGSSL:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-demo-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://1v.collab.name.ng}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      SAFE_CORPS_API_KEY: ${SAFE_CORPS_API_KEY:-}
      PARTNER_API_KEYS: ${PARTNER_API_KEYS:-}
      PARTNER_WEBHOOK_URL: ${PARTNER_WEBHOOK_URL:-}
      PARTNER_WEBHOOK_URLS: ${PARTNER_WEBHOOK_URLS:-}
      MIGRATE_LEGACY: ${MIGRATE_LEGACY:-}
    expose:
      - "7474"
    volumes:
      - sos-data:/data
volumes:
  sos-data:
