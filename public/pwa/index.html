<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>Utilities</title>
<link rel="manifest" id="manifest" />
<link rel="apple-touch-icon" id="appleIcon" />
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#121824; --line:#1e293b; --txt:#eef2f9; --mut:#8b9bb4;
    --sos:#ff4d5e; --ring:#35c08a;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:
    radial-gradient(900px 500px at 50% -10%, #182033 0%, transparent 55%), var(--bg);
    color:var(--txt);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid transparent}
  .bar .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
  .bar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.2px;color:var(--mut)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
  .sos-btn{width:168px;height:168px;border-radius:50%;background:linear-gradient(145deg,var(--sos),#c62838);
    color:#fff;border:none;font-size:32px;font-weight:800;letter-spacing:.08em;cursor:pointer;
    box-shadow:0 18px 50px -16px rgba(255,77,94,.75), inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .12s}
  .sos-btn:active{transform:scale(.96)}
  .sos-btn:disabled{opacity:.55;cursor:wait}
  .sos-btn.on{animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.45)}70%{box-shadow:0 0 0 28px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
  .status{font-size:13px;color:var(--mut);min-height:18px;text-align:center;max-width:280px;line-height:1.4}
  .install{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;display:none;z-index:5}

  /* Quote cover while SOS is live — no close button */
  #cover{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    padding:28px 22px;touch-action:none;user-select:none;-webkit-user-select:none;
    background:radial-gradient(1200px 800px at 30% 20%, #1a2240 0%, #0a0c12 70%);
    color:var(--txt)}
  #cover.show{display:flex}
  .cover-card{max-width:440px;width:100%;text-align:center}
  .cover-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6b7c99;margin-bottom:22px}
  .cover-quote{font-size:clamp(22px,5.2vw,34px);line-height:1.35;font-weight:500;letter-spacing:-.02em;
    margin:0 0 18px;opacity:1;transition:opacity .6s}
  .cover-quote.fade{opacity:0}
  .cover-cite{font-size:13px;color:#9aa8c0;font-style:italic;min-height:20px}
  .hold-wrap{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .hold-ring{width:54px;height:54px}
  .hold-ring circle{fill:none;stroke-width:3;transform:rotate(-90deg);transform-origin:50% 50%}
  .hold-ring .bg{stroke:rgba(255,255,255,.12)}
  .hold-ring .fg{stroke:var(--ring);stroke-linecap:round;stroke-dasharray:150.8;stroke-dashoffset:150.8;transition:none}
  .hold-hint{font-size:11px;color:#5f6f8c;letter-spacing:.04em}
</style>
</head>
<body>
<div class="bar"><div class="logo" id="logo">U</div><h1 id="appName">Utilities</h1></div>
<main id="main"></main>
<button class="install" id="installBtn" onclick="doInstall()">Add to Home Screen</button>

<div id="cover" aria-hidden="true">
  <div class="cover-card">
    <div class="cover-eyebrow">Daily Word</div>
    <p class="cover-quote" id="coverQuote"></p>
    <div class="cover-cite" id="coverCite"></div>
  </div>
  <div class="hold-wrap">
    <svg class="hold-ring" viewBox="0 0 54 54" aria-hidden="true">
      <circle class="bg" cx="27" cy="27" r="24"></circle>
      <circle class="fg" id="holdFg" cx="27" cy="27" r="24"></circle>
    </svg>
    <div class="hold-hint">Hold to end · 8s</div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
