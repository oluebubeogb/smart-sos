<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111317" />
<title>Utilities</title>
<link rel="manifest" id="manifest" />
<link rel="apple-touch-icon" id="appleIcon" />
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root{ --bg:#0f1115; --panel:#181b22; --line:#262b35; --txt:#eef1f6; --mut:#9aa4b5; --accent:#4c8dff; --sos:#e5484d; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);
    display:flex;flex-direction:column;min-height:100vh}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .logo{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
  .bar h1{font-size:16px;margin:0;font-weight:600}
  main{flex:1;padding:16px;display:flex;flex-direction:column}
  .calc{max-width:360px;margin:0 auto;width:100%}
  .screen{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:right;
    font-size:34px;min-height:70px;word-break:break-all;margin-bottom:12px}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .key{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 0;font-size:20px;
    cursor:pointer;text-align:center;user-select:none}
  .key:active{background:#222733}
  .key.op{color:var(--accent)} .key.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
  .notes{max-width:480px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
  .notes textarea{flex:1;min-height:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    color:var(--txt);padding:16px;font-size:15px;resize:none;outline:none;font-family:inherit}
  .sos-zone{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .sos-btn{width:120px;height:120px;border-radius:50%;background:var(--sos);color:#fff;border:none;
    font-size:26px;font-weight:700;letter-spacing:.06em;cursor:pointer;box-shadow:0 10px 30px -8px var(--sos);
    transition:transform .1s}
  .sos-btn:active{transform:scale(.96)}
  .sos-btn.on{animation:breathe 1.4s infinite}
  @keyframes breathe{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 22px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  .status{font-size:13px;color:var(--mut);min-height:18px;text-align:center}
  .foot{padding:10px;text-align:center;color:#3a4150;font-size:11px}
  .install{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;display:none}
</style>
</head>
<body>
<div class="bar"><div class="logo" id="logo">U</div><h1 id="appName">Utilities</h1></div>
<main id="main"></main>
<div class="foot" id="foot"></div>
<div class="install" id="installBtn" onclick="doInstall()">Add to Home Screen</div>
<script src="./app.js"></script>
</body>
</html>
