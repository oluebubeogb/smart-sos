<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart SOS</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="/admin-extra.js"></script>
<style>
  :root{
    --bg:#0b0e14; --bg2:#0e1320; --panel:#121a2a; --panel2:#0f1626;
    --line:#1e293f; --txt:#eef2f9; --mut:#8898b5; --mut2:#5f6f8c;
    --accent:#ff4d5e; --accent-soft:rgba(255,77,94,.14); --grn:#35c08a; --chip:#1a2438;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Inter",system-ui,Segoe UI,Roboto,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, #141d30 0%, transparent 60%), var(--bg);
    color:var(--txt);-webkit-font-smoothing:antialiased}
  /* ---- login ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login{width:100%;max-width:360px;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:18px;padding:34px 30px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:
    linear-gradient(135deg,var(--accent),#b0323f);display:grid;place-items:center;
    box-shadow:0 0 0 1px rgba(255,77,94,.3),0 8px 20px -8px var(--accent)}
  .brand .mark span{display:block;width:10px;height:10px;border-radius:50%;background:#fff}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
  .login .sub{color:var(--mut2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 0 45px}
  .login form{margin-top:22px}
  .login label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
    background:#0a0f1b;color:var(--txt);font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line);background:var(--chip);color:var(--txt);border-radius:11px;
    padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s,border .15s}
  .btn:hover{background:#1f2c45}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#d93a49);border-color:transparent;width:100%;margin-top:22px;padding:12px}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.danger{background:transparent;border-color:rgba(255,77,94,.4);color:var(--accent)}
  .btn.danger:hover{background:var(--accent-soft)}
  .btn.go{background:linear-gradient(135deg,var(--accent),#d93a49);border-color:transparent}
  .err{color:var(--accent);font-size:12.5px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
let ws, current=null, map, marker, track, room, filter="live", search="";
let sessionsCache = [];

// ---- dashboard CSS injected at runtime ----
const DASH_CSS = `
.shell{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr auto;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 18px;
  background:linear-gradient(180deg,#121a2a,#0e1320);border-bottom:1px solid var(--line)}
.topbar .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#b0323f);
  display:grid;place-items:center;box-shadow:0 6px 16px -8px var(--accent)}
.topbar .mark span{width:8px;height:8px;border-radius:50%;background:#fff}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px}
.topbar .sp{flex:1}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0c121e}
.segs{display:flex;gap:6px;padding:12px}
.seg{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--mut);
  border:1px solid transparent}
.seg:hover{background:#111a2b}
.seg.active{background:var(--chip);color:var(--txt);border-color:var(--line)}
.seg .n{font-size:11px;color:var(--mut2);margin-left:5px}
.searchbox{padding:0 12px 10px}
.searchbox input{padding:9px 11px;font-size:13px}
.list{overflow:auto;flex:1;min-height:0}
.item{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.item:hover{background:#111a2b}
.item.sel{background:#15223a;box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.item .s{color:var(--mut);font-size:12px;margin-top:4px}
.item .meta{display:flex;align-items:center;gap:8px;margin-top:7px}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;
  text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.ended{background:#19202f;color:var(--mut)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);
  animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.5)}70%{box-shadow:0 0 0 7px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.ico{color:var(--mut2);font-size:12px;display:inline-flex;gap:3px;align-items:center}
.detail{overflow:auto;padding:20px 22px;min-height:0}
.empty{display:grid;place-items:center;height:100%;color:var(--mut2);text-align:center}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.dhead .id{color:var(--mut2);font-size:13px;font-weight:500}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut)}
.kv .v{color:var(--txt);font-weight:500;text-align:right}
#map{height:280px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut)}
audio{width:100%;margin-top:8px;filter:saturate(.9)}
.audio-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.audio-row .nm{color:var(--mut);min-width:140px}
.audio-row.playing .nm{color:var(--accent)}
.exp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.exp-btn{background:#ff4d5e;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.exp-btn:disabled{opacity:.4;cursor:default}
.chunk-row{display:block;padding:10px;border:1px solid #1f2633;border-radius:10px;background:#0a0e14}
.chunk-row.marked{border-color:#ff4d5e}
.chunk-row.has-sound .lvl{color:#ffb020}
.chunk-head{display:flex;gap:10px;align-items:center;font-size:13px}
.mark{display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--mut)}
canvas.wave{width:100%;height:56px;display:block;margin-top:8px;border-radius:6px;cursor:pointer;touch-action:none}

.playlist-hint{font-size:12px;color:var(--mut2);margin:0 0 10px}
.live-card{border-color:rgba(255,77,94,.35);box-shadow:0 0 0 1px rgba(255,77,94,.08) inset}
.live-av{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:900px;gap:10px;margin-bottom:10px}
@media (max-width:900px){.live-av{grid-template-columns:1fr}}
.live-tile{position:relative;background:#070b12;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:160px;aspect-ratio:4/3}
.live-tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.live-tile .cap{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#eef2f9;backdrop-filter:blur(6px)}
.live-tile.empty{display:grid;place-items:center;color:var(--mut2);font-size:12px}
.live-audio-wrap{margin-top:4px}
.footer{grid-column:1/-1;padding:9px 18px;border-top:1px solid var(--line);color:var(--mut2);
  font-size:11.5px;background:#0c121e;display:flex;align-items:center;gap:7px}
.foot-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7}
.src{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#19202f;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 18px;font-size:13px;color:var(--mut)}
.timeline li:before{content:"";position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.timeline li:after{content:"";position:absolute;left:6px;top:11px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline li b{color:var(--txt);font-weight:500}
.exp-bar{flex-wrap:wrap}
.exp-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tool-btn{background:#19202f;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer}
.tool-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mark-all{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
.chunk-row{margin-bottom:8px}
.chunk-row .chunk-body{display:block}
.chunk-row .mini-play{display:none;margin-left:auto;background:#19202f;border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer}
.chunk-row .expand-btn{display:none;background:transparent;border:0;color:var(--mut2);font-size:11px;cursor:pointer;padding:2px 4px}
#audioList.compact .chunk-row,#videoList.compact .chunk-row{padding:6px 10px}
#audioList.compact .chunk-row .chunk-body,#videoList.compact .chunk-row .chunk-body{display:none}
#audioList.compact .chunk-row.expanded .chunk-body,#videoList.compact .chunk-row.expanded .chunk-body{display:block;margin-top:8px}
#audioList.compact .chunk-row .mini-play,#videoList.compact .chunk-row .mini-play,
#audioList.compact .chunk-row .expand-btn,#videoList.compact .chunk-row .expand-btn{display:inline-flex}
#audioList.compact .chunk-head,#videoList.compact .chunk-head{gap:8px}
#audioList.compact .chunk-head .nm,#videoList.compact .chunk-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:900px){.video-grid{grid-template-columns:1fr}}
.video-chunk{border:1px solid #1f2633;border-radius:10px;background:#0a0e14;padding:8px}
.video-chunk .vh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-bottom:6px}
.video-chunk video{width:100%;border-radius:6px;background:#000;max-height:220px}
#videoList .chunk-row video{width:100%;max-height:240px;border-radius:6px;background:#000}
#videoList:not(.compact) #vidRows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:900px){#videoList:not(.compact) #vidRows{grid-template-columns:1fr}}
#videoList:not(.compact) .mini-play,#videoList:not(.compact) .expand-btn{display:none}
`;

function injectCSS(){
  if($("#dash-css")) return;
  const st=document.createElement("style"); st.id="dash-css"; st.textContent=DASH_CSS;
  document.head.appendChild(st);
}

async function api(path, opts={}){
  const r = await fetch(path, {credentials:"same-origin", headers:{"Content-Type":"application/json"}, ...opts});
  if(r.status===401){ renderLogin(); throw new Error("unauth"); }
  return r.json();
}

function renderLogin(msg){
  document.getElementById("app").innerHTML = `
  <div class="login-wrap"><div class="login">
    <div class="brand">
      <img class="mark" src="/icon.png" alt="" style="background:#fff;padding:3px;object-fit:contain">
      <div><h1>Smart SOS</h1></div>
    </div>
    <div class="sub">Admin Console</div>
    <form onsubmit="doLogin(event)">
      <label>Username</label>
      <input id="u" autocomplete="username" autofocus />
      <label>Password</label>
      <input id="p" type="password" autocomplete="current-password" />
      <button class="btn primary" type="submit">Sign in</button>
      <div class="err">${msg||""}</div>
    </form>
  </div></div>`;
}
window.doLogin = async (e)=>{
  if(e) e.preventDefault();
  const r = await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:$("#u").value,password:$("#p").value})});
  if(r.ok) start(); else renderLogin("Invalid credentials");
};
window.logout = async ()=>{ await fetch("/api/logout",{method:"POST",credentials:"same-origin"}); location.reload(); };

function renderApp(){
  injectCSS();
  document.getElementById("app").innerHTML = `
  <div class="shell${SSOS.collapsed?' collapsed':''}${SSOS.page==='sessions'?' has-sess':''}">
    <div class="topbar">
      <img class="mark" src="/icon.png" alt="" style="background:#fff;padding:3px;object-fit:contain">
      <h1>Smart SOS</h1>
      <div class="sp"></div>
      <span class="mut" style="font-size:12.5px;margin-right:10px">${(window.SSOS&&SSOS.me)?SSOS.me.username+(SSOS.me.role==='super'?' · superadmin':''):''}</span>
      <button class="btn" onclick="logout()">Log out</button>
    </div>
    <div class="sidebar navbar">
      ${ssosNav()}
    </div>
    ${SSOS.page==='sessions'?`<div class="sidebar sessbar">
      <div class="sesshead">${filter==='live'?'Live':'History'}</div>
      <div class="searchbox"><input id="search" placeholder="Search name, id, device…" oninput="onSearch(this.value)" /></div>
      <div class="list" id="list"></div>
    </div>`:'<div id="list" style="display:none"></div>'}
    <div class="detail" id="detail"><div class="empty"><div>Select an alert to view its session.</div></div></div>
    <div class="footer"><span class="foot-dot"></span>Smart SOS</div>
  </div>`;
  if(search) $("#search").value = search;
  renderList();
  if(SSOS.page!=='sessions'){ if(room){ try{ room.disconnect(); }catch{} room=null; } current=null; ssosRenderPage($("#detail")); }
}
window.__filter = ()=>filter;
window.__rerender = ()=>renderApp();

window.setFilter = (f)=>{ filter=f; SSOS.page='sessions'; renderApp(); };
window.onSearch = (v)=>{ search=v.trim().toLowerCase(); renderList(); };

function fmtDur(ms){
  if(ms==null) return "—";
  const s=Math.round(ms/1000); const m=Math.floor(s/60); const r=s%60;
  return m?`${m}m ${r}s`:`${r}s`;
}
function matchesSearch(s){
  if(!search) return true;
  return (s.decoyName+" "+s.id+" "+s.deviceId+" "+(s.source||"")).toLowerCase().includes(search);
}
function visibleSessions(){
  return sessionsCache
    .filter(s=> filter==='live' ? s.active : !s.active)
    .filter(matchesSearch)
    .sort((a,b)=> (b.active-a.active) || (b.createdAt-a.createdAt));
}

function renderList(){
  const liveN = sessionsCache.filter(s=>s.active).length;
  const histN = sessionsCache.filter(s=>!s.active).length;
  const nl=$("#n-live"), nh=$("#n-hist"); if(nl) nl.textContent=liveN?`(${liveN})`:""; if(nh) nh.textContent=histN?`(${histN})`:"";
  const el = $("#list"); if(!el) return;
  const rows = visibleSessions();
  if(!rows.length){ el.innerHTML = `<p class="mut" style="padding:16px;font-size:13px">${filter==='live'?'No active alerts.':'No past alerts.'}</p>`; return; }
  el.innerHTML = rows.map(s=>`
    <div class="item ${current===s.id?'sel':''}" onclick="openSession('${s.id}')">
      <div class="t">${s.decoyName} <span class="id" style="color:var(--mut2);font-weight:500;font-size:12px">· ${s.id}</span></div>
      <div class="s">${new Date(s.createdAt).toLocaleString()}</div>
      <div class="meta">
        <span class="pill ${s.active?'live':'ended'}">${s.active?'<span class=pulse></span>Live':'Ended'}</span>
        <span class="ico">◉ ${s.nearbyCount}</span>
        ${s.hasAudio?'<span class="ico">♪ audio</span>':''}
        ${s.hasVideo?'<span class="ico">▣ video</span>':''}
        ${s.org?`<span class="org-chip">${s.org}</span>`:`<span class="src">${s.source||'?'}</span>`}
      </div>
    </div>`).join("");
}

window.openSession = async (id)=>{
  current=id; renderList();
  const s = await api(`/api/session/${id}`);
  const d = $("#detail");
  d.innerHTML = `
    <div class="dhead">
      <h2>${s.decoyName}</h2><span class="id">· ${s.id}</span>
      <span class="pill ${s.active?'live':'ended'}">${s.active?'<span class=pulse></span>Live':'Ended'}</span>
      <div class="actions">
        ${s.active?`<button class="btn go" id="listenBtn" onclick="startListen('${id}')">Watch live</button>`:''}
        ${s.active?`<button class="btn danger" onclick="endSession('${id}')">End session</button>`:''}
      </div>
    </div>
    <div class="card live-card" id="liveCard" style="${s.active?'':'display:none'}">
      <h3>Live A/V <span class="pill live" style="margin-left:8px"><span class="pulse"></span>stream</span></h3>
      <div class="live-av" id="liveTiles">
        <div class="live-tile empty" data-slot="__wait">Waiting for video…</div>
      </div>
      <div class="live-audio-wrap"><audio id="liveAudio" autoplay controls style="width:100%;display:none"></audio></div>
      <p class="mut" id="liveHint" style="font-size:12px;margin:8px 0 0">Tap <b>Watch live</b> above to subscribe. Video is low-res; audio stays as before.</p>
    </div>
    <div class="grid2">
      <div class="card"><h3>Session</h3>
        <div class="kv"><span class="k">Status</span><span class="v">${s.status}</span></div>
        <div class="kv"><span class="k">Source</span><span class="v">${(s.source||'unknown').toUpperCase()}</span></div>
        <div class="kv"><span class="k">Device</span><span class="v">${s.deviceId}</span></div>
        <div class="kv"><span class="k">Started</span><span class="v">${new Date(s.createdAt).toLocaleString()}</span></div>
        <div class="kv"><span class="k">Ended</span><span class="v">${s.endedAt?new Date(s.endedAt).toLocaleString():'—'}</span></div>
        <div class="kv"><span class="k">Duration</span><span class="v">${fmtDur(s.duration)}</span></div>
        <div class="kv"><span class="k">Last location</span><span class="v" id="loc">${fmtLoc(s.lastLocation)}</span></div>
      </div>
      <div class="card"><h3>Timeline</h3>
        <ul class="timeline">
          <li><b>SOS triggered</b><br>${new Date(s.createdAt).toLocaleString()}</li>
          ${s.locations&&s.locations.length?`<li><b>${s.locations.length}</b> location point(s)</li>`:''}
          ${s.hasAudio?`<li><b>Audio recorded</b> · ${(s.audioFiles||[]).length} file(s)</li>`:''}
          ${s.hasVideo?`<li><b>Video recorded</b> · ${(s.videoFiles||[]).length} file(s)</li>`:''}
          ${s.endedAt?`<li><b>${s.status}</b><br>${new Date(s.endedAt).toLocaleString()}</li>`:'<li class="mut">Session active…</li>'}
        </ul>
      </div>
    </div>
    <div class="card"><h3>Location trail</h3><div id="map"></div></div>
    <div class="card"><h3>Nearby devices (${(s.nearby||[]).length}/25)</h3>
      <table id="nearby"><thead><tr><th>Name</th><th>Address</th><th>Type</th><th>RSSI</th></tr></thead>
      <tbody>${nearbyRows(s.nearby)}</tbody></table>
    </div>
    <div class="card"><h3>Saved audio${s.hasAudio?'':' — none'}</h3>
      <div id="audioList" class="mut" style="font-size:13px">${s.hasAudio?'Loading…':'No audio uploaded for this session.'}</div>
    </div>
    <div class="card"><h3>Saved video${s.hasVideo?'':' — none'}</h3>
      <div id="videoList" class="mut" style="font-size:13px">${s.hasVideo?'Loading…':'No video uploaded for this session. Low-res chunks save separately from audio when cams are available.'}</div>
    </div>`;
  setupMap(s);
  if(s.hasAudio) loadAudio(id);
  if(s.hasVideo) loadVideo(id);
};

function fmtLoc(l){ return l ? `${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} (±${l.acc??'?'}m)` : "—"; }
function nearbyRows(list){

function setupMap(s){

}

function compactOn(kind){

}
function setCompact(kind, on){

function wireMarkAll(box){
  const all = box.querySelector(".mark-all-cb"); if(!all) return;
  const sync = ()=>{
    const mks = [...box.querySelectorAll("input.mk")];
    all.checked = mks.length > 0 && mks.every(c=>c.checked);
    all.indeterminate = mks.some(c=>c.checked) && !all.checked;
  };
  // BUGFIX: each per-row change event re-ran sync(), which flipped all.checked back to
  // false after the first row -> only one row ever got marked. Capture the target first.
  all.addEventListener("change", ()=>{
    const want = all.checked;
    box.querySelectorAll("input.mk").forEach(c=>{
      if(c.checked === want) return;
      c.checked = want;
      c.dispatchEvent(new Event("change", {bubbles:true}));
    });
    sync();
  });
  box.querySelectorAll("input.mk").forEach(c=>c.addEventListener("change", sync));
  sync();
}

function wireCompact(box, kind){
  const btn = box.querySelector(".compact-btn"); if(!btn) return;
  btn.addEventListener("click", ()=>{
    const on = !box.classList.contains("compact");
    box.classList.toggle("compact", on);
    setCompact(kind, on);
    btn.classList.toggle("on", on);
    btn.textContent = on ? "Full cards" : "Condensed";
    if(!on) box.querySelectorAll(".chunk-row.expanded").forEach(r=>{ r.classList.remove("expanded"); const b=r.querySelector(".expand-btn"); if(b) b.textContent="▾"; });
  });
}

function wireCondensedControls(box){
  box.querySelectorAll(".mini-play").forEach(btn=>{
    btn.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      const i = btn.dataset.idx;
      const au = box.querySelector(`[data-chunk-idx="${i}"]`);
      if(!au) return;
      const row = btn.closest(".chunk-row");
      if(au.tagName==="VIDEO" && row && !row.classList.contains("expanded")){ row.classList.add("expanded"); const eb=row.querySelector(".expand-btn"); if(eb) eb.textContent="▴"; }
      if(au.paused){
        const p = au.play(); if(p&&p.catch)p.catch(()=>{});
        btn.textContent = "❚❚";
      } else {
        try{ au.pause(); }catch{}
        btn.textContent = "▶";
      }
    });
  });
  box.querySelectorAll(".expand-btn").forEach(btn=>{
    btn.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      const row = btn.closest(".chunk-row");
      if(!row) return;
      const open = row.classList.toggle("expanded");
      btn.textContent = open ? "▴" : "▾";
    });
  });
  box.querySelectorAll("audio[data-chunk-idx],video[data-chunk-idx]").forEach(au=>{
    au.addEventListener("play", ()=>{
      const i = au.getAttribute("data-chunk-idx");
      const b = box.querySelector(`.mini-play[data-idx="${i}"]`);
      if(b) b.textContent = "❚❚";
    });
    au.addEventListener("pause", ()=>{
      const i = au.getAttribute("data-chunk-idx");
      const b = box.querySelector(`.mini-play[data-idx="${i}"]`);
      if(b) b.textContent = "▶";
    });
  });
}

let _actx=null;
async function drawWave(box, i, url){
  const cv = box.querySelector(`canvas.wave[data-idx="${i}"]`); const au = box.querySelector(`audio[data-chunk-idx="${i}"]`);
  if(!cv) return;
  const W = cv.width = Math.max(300, cv.clientWidth*devicePixelRatio||600), H = cv.height = 56*devicePixelRatio;
  const g = cv.getContext("2d");
  let peaks=null, dur=0;
  const paint = ()=>{
    g.clearRect(0,0,W,H); g.fillStyle="#0d1117"; g.fillRect(0,0,W,H);
    if(!peaks){ g.fillStyle="#3a4150"; g.fillRect(0,H/2-1,W,2); return; }
    const pos = au && dur ? au.currentTime/dur : 0;
    for(let x=0;x<peaks.length;x++){
      const h = Math.max(1.5*devicePixelRatio, peaks[x]*(H-6));
      const hot = peaks[x] > 0.25;
      g.fillStyle = x/peaks.length <= pos ? "#ff4d5e" : (hot ? "#e9edf5" : "#4a5263");
      g.fillRect(x, (H-h)/2, 1, h);
    }
  };
  paint();
  try{
    const buf = await (await fetch(url,{credentials:"same-origin"})).arrayBuffer();
    _actx = _actx || new (window.AudioContext||window.webkitAudioContext)();
    const ab = await _actx.decodeAudioData(buf);
    dur = ab.duration; const d = ab.getChannelData(0); const step = Math.max(1, Math.floor(d.length/W));
    peaks = new Float32Array(Math.floor(d.length/step)); let mx=0, loud=0;
    for(let x=0;x<peaks.length;x++){ let m=0; for(let k=x*step,e=k+step;k<e;k++){ const v=Math.abs(d[k]); if(v>m)m=v; } peaks[x]=m; if(m>mx)mx=m; }
    const norm = Math.max(mx, 0.05); for(let x=0;x<peaks.length;x++){ peaks[x]/=norm; if(peaks[x]*norm>0.08) loud++; }
    const row = cv.closest(".chunk-row") || cv.parentElement;
    const lvl = row.querySelector(".lvl"); const pct = Math.round(100*loud/peaks.length);
    if(lvl) lvl.textContent = pct<3 ? "· idle" : `· sound ${pct}%`;
    if(pct>=3) row.classList.add("has-sound");
  }catch(e){ const row=cv.closest(".chunk-row")||cv.parentElement; const lvl=row.querySelector(".lvl"); if(lvl) lvl.textContent="· waveform n/a"; }
  paint();
  if(au){ au.addEventListener("timeupdate", paint); au.addEventListener("seeked", paint); }
  let drag=false;
  const seek = ev=>{ if(!au) return; const r=cv.getBoundingClientRect(); const f=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    const d2 = dur || au.duration; if(isFinite(d2)&&d2>0){ au.currentTime=f*d2; paint(); } };
  cv.addEventListener("pointerdown", ev=>{ drag=true; cv.setPointerCapture(ev.pointerId); seek(ev); if(au&&au.paused){ const p=au.play(); if(p&&p.catch)p.catch(()=>{}); } });
  cv.addEventListener("pointermove", ev=>{ if(drag) seek(ev); });
  cv.addEventListener("pointerup", ()=>{ drag=false; });
}

function wireExport(box, id, kind){
  const btn = box.querySelector(".export-btn"); if(!btn) return;
  const label = kind === "video" ? "Download marked" : "Export marked";
  const marked = ()=>[...box.querySelectorAll("input.mk:checked")].sort((a,b)=>a.dataset.n-b.dataset.n);
  box.querySelectorAll("input.mk").forEach(c=>c.addEventListener("change", ()=>{
    const n = marked().length; btn.textContent = `${label} (${n})`; btn.disabled = !n;
    c.closest(".chunk-row").classList.toggle("marked", c.checked);
  }));
  btn.addEventListener("click", async ()=>{
    const list = marked(); if(!list.length) return;
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Exporting…";
    try{
      if(kind === "video"){
        // video segments are separate files (each playable with sound) — download each marked one
        for(const c of list){
          const r = await fetch(c.dataset.url,{credentials:"same-origin"}); if(!r.ok) throw new Error("fetch "+r.status);
          const b = await r.blob(); const a = document.createElement("a"); a.href = URL.createObjectURL(b);
          a.download = `sos-${id}-${c.dataset.name||"video"}`; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(a.href), 60000); await new Promise(r=>setTimeout(r, 400));
        }
        btn.textContent = old; btn.disabled = false; return;
      }
      const parts = [];
      for(const c of list){ const r = await fetch(c.dataset.url,{credentials:"same-origin"}); if(!r.ok) throw new Error("fetch "+r.status); parts.push(await r.arrayBuffer()); }
      const blob = new Blob(parts, {type:"audio/webm"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `sos-${id}-export.webm`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
    }catch(e){ alert("Export failed: "+e.message); }
    btn.textContent = old; btn.disabled = false;
  });
}

function wireChunkPlaylist(box){
  const audios = [...box.querySelectorAll("audio[data-chunk-idx]")];
  if(audios.length < 1) return;
  audios.forEach((a, i)=>{
    a.addEventListener("play", ()=>{
      // Pause siblings (full recording + other chunks) so only one plays
      box.querySelectorAll("audio").forEach(other=>{
        if(other!==a && !other.paused){ try{ other.pause(); }catch{} }
      });
      box.querySelectorAll(".audio-row[data-kind=chunk]").forEach(r=>r.classList.remove("playing"));
      const row = a.closest(".audio-row"); if(row) row.classList.add("playing");
      const hint = box.querySelector(".playlist-hint");
      if(hint) hint.textContent = `Playing continuously · chunk ${i+1} of ${audios.length}`;
    });
    a.addEventListener("ended", ()=>{
      const next = audios[i+1];
      if(!next){
        const row = a.closest(".audio-row"); if(row) row.classList.remove("playing");
        const hint = box.querySelector(".playlist-hint");
        if(hint) hint.textContent = "Chunks · playing continuously (auto-advances)";
        return;
      }
      try{
        next.currentTime = 0;
        const p = next.play();
        if(p && p.catch) p.catch(err=>console.warn("playlist next", err));
      }catch(err){ console.warn("playlist next", err); }
    });
  });
}

function labelForTrack(trk, pub){
  const name = ((pub && (pub.trackName || pub.name)) || (trk && trk.name) || "").toLowerCase();
  if(name.includes("rear") || name.includes("environment") || name.includes("back")) return "Rear";
  if(name.includes("front") || name.includes("user") || name.includes("facing")) return "Front";
  if(name.includes("camera") || name === "cam") return "Camera";
  try{
    const s = trk && trk.mediaStreamTrack && trk.mediaStreamTrack.getSettings && trk.mediaStreamTrack.getSettings();
    if(s && s.facingMode === "environment") return "Rear";
    if(s && s.facingMode === "user") return "Front";
  }catch{}
  return "Camera";
}

// Phase 5: one card is always visible ("Waiting for video…"); extra cams appear only
// once they actually render frames and hide again after ~5s without new frames.
const tileState = new Map(); let tileTimer=null;
function placeholderTile(){ return `<div class="live-tile empty" data-slot="__wait">Waiting for video…</div>`; }
function liveTileMaint(){
  const box=$("#liveTiles"); if(!box){ clearInterval(tileTimer); tileTimer=null; return; }
  const now=Date.now();
  for(const [slot,st] of tileState){
    const v=st.video; if(!v.isConnected){ tileState.delete(slot); continue; }
    const t=v.currentTime; const hasFrames=v.videoWidth>0 && v.readyState>=2;
    if(hasFrames && t!==st.lastT){ st.lastT=t; st.lastFrame=now; }
    st.live = hasFrames && (now-st.lastFrame)<5000;
  }
  const live=[...tileState.values()].filter(x=>x.live);
  // show live cams; if none live, show the most recent one (frozen) or the placeholder
  const ph=box.querySelector('[data-slot="__wait"]');
  // Non-live tiles are parked off-layout (not display:none) so the <video> keeps
  // decoding and can flip to live as soon as frames arrive. Primary = live tile(s);
  // if none live yet, show the most recently attached tile rather than a dead placeholder.
  const park=(t,on)=>{ if(on){ t.style.cssText="position:absolute;left:-9999px;width:160px;height:120px;opacity:0"; } else t.style.cssText=""; };
  const all=[...tileState.values()];
  const fallback = !live.length && all.length ? all.reduce((a,b)=> (b.lastFrame>=a.lastFrame? b:a)) : null;
  for(const st of all) park(st.tile, !(st.live || st===fallback && st.lastFrame>0));
  if(!live.length && !(fallback && fallback.lastFrame>0)){
    if(ph) ph.style.display="";
    else box.insertAdjacentHTML("afterbegin", placeholderTile());
  } else if(ph) ph.style.display="none";
}
function ensureLiveTile(slot, label){
  const box = $("#liveTiles"); if(!box) return null;
  let st = tileState.get(slot);
  if(!st || !st.tile.isConnected){
    const tile=document.createElement("div"); tile.className="live-tile"; tile.dataset.slot=slot; tile.style.cssText="position:absolute;left:-9999px;width:160px;height:120px;opacity:0";
    box.appendChild(tile);
    st={tile, video:null, lastT:-1, lastFrame:0, live:false}; tileState.set(slot, st);
  }
  st.tile.innerHTML = `<span class="cap">${label}</span><video autoplay playsinline muted></video>`;
  st.video = st.tile.querySelector("video"); st.lastT=-1; st.lastFrame=0;
  st.video.addEventListener("playing", liveTileMaint);
  if(!tileTimer) tileTimer=setInterval(liveTileMaint, 1000);
  return st.video;
}

function attachRemoteAudio(trk){
  if(!trk || trk.kind!=='audio') return;
  const a=$("#liveAudio"); if(!a) return;
  a.style.display="block";
  a.autoplay=true; a.muted=false; a.volume=1;
  a.playsInline=true;
  a.srcObject=new MediaStream([trk.mediaStreamTrack]);
  const p=a.play(); if(p&&p.catch) p.catch(err=>console.warn("audio play", err));
}

function attachRemoteVideo(trk, pub){
  if(!trk || trk.kind!=='video') return;
  const label = labelForTrack(trk, pub);
  const slot = label === "Front" ? "front" : (label === "Rear" ? "rear" : ("cam-"+((pub&&pub.trackSid)||Math.random().toString(36).slice(2,7))));
  const video = ensureLiveTile(slot, label);
  if(!video) return;
  try{ trk.attach(video); }catch{
    video.srcObject = new MediaStream([trk.mediaStreamTrack]);
  }
  video.muted = true; // audio comes from #liveAudio only
  const p = video.play(); if(p&&p.catch) p.catch(()=>{});
}

function attachPublication(pub){
  if(!pub || !pub.track) return;
  const kind = pub.kind || (pub.track && pub.track.kind);
  if(kind === 'audio' || kind === LivekitClient.Track.Kind.Audio) attachRemoteAudio(pub.track);
  else if(kind === 'video' || kind === LivekitClient.Track.Kind.Video) attachRemoteVideo(pub.track, pub);
}

function clearLiveTiles(){
  const box = $("#liveTiles");
  tileState.clear();
  if(box) box.innerHTML = placeholderTile();
  const a=$("#liveAudio"); if(a){ a.srcObject=null; a.style.display="none"; }
}

window.startListen = async (id)=>{
  const {livekitUrl, token} = await api(`/api/session/${id}/listen-token`);
  try{
    if(room){ try{ room.disconnect(); }catch{} room=null; }
    clearLiveTiles();
    // adaptiveStream MUST be off here: hidden (display:none) tiles report 0x0, so LiveKit
    // paused those video tracks -> no frames ever arrived -> tile never became "live".
    room = new LivekitClient.Room({ adaptiveStream: false, dynacast: false });
    room.on(LivekitClient.RoomEvent.TrackPublished,(pub)=>{ try{ pub.setSubscribed && pub.setSubscribed(true); }catch{} });
    room.on(LivekitClient.RoomEvent.TrackMuted, ()=> liveTileMaint());
    room.on(LivekitClient.RoomEvent.TrackUnmuted, ()=> liveTileMaint());
    room.on(LivekitClient.RoomEvent.TrackSubscribed,(trk, pub)=> {
      if(trk.kind==='audio') attachRemoteAudio(trk);
      else if(trk.kind==='video') attachRemoteVideo(trk, pub);
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed,(trk)=>{
      try{ trk.detach(); }catch{}
      liveTileMaint();
    });
    await room.connect(livekitUrl, token);
    // Attach tracks already published before we joined
    for (const p of room.remoteParticipants.values()){
      const pubs = p.trackPublications;
      if(pubs && typeof pubs.forEach === 'function'){
        pubs.forEach(pub=> attachPublication(pub));
      } else {
        if(p.audioTrackPublications && typeof p.audioTrackPublications.forEach === 'function'){
          p.audioTrackPublications.forEach(pub=> attachPublication(pub));
        } else if(p.audioTrackPublications && typeof p.audioTrackPublications.values === 'function'){
          for(const pub of p.audioTrackPublications.values()) attachPublication(pub);
        }
        if(p.videoTrackPublications && typeof p.videoTrackPublications.forEach === 'function'){
          p.videoTrackPublications.forEach(pub=> attachPublication(pub));
        } else if(p.videoTrackPublications && typeof p.videoTrackPublications.values === 'function'){
          for(const pub of p.videoTrackPublications.values()) attachPublication(pub);
        }
      }
    }
    const b=$("#listenBtn"); if(b) b.textContent = "Watching…";
    const hint=$("#liveHint"); if(hint) hint.textContent = "Subscribed · low-res video + high-quality audio";
  }catch(e){ alert("LiveKit connect failed: "+e.message+"\nCheck LIVEKIT_URL / API key+secret match the SFU."); }
};
window.endSession = async (id)=>{
  await api(`/api/session/${id}/end`,{method:"POST"});
  if(room){ try{ room.disconnect(); }catch{} room=null; }
  clearLiveTiles();
};

function connectWS(){
  const proto = location.protocol==="https:"?"wss":"ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev)=>{
    const m = JSON.parse(ev.data);
    if(m.type==="hello"){ sessionsCache=m.sessions; renderList(); }
    else if(m.type==="alert"){ upsert(m.session); renderList(); if(Notification.permission==="granted") new Notification("SOS — Smart SOS",{body:m.session.decoyName}); }
    else if(m.type==="location" && m.sessionId===current){ const el=$("#loc"); if(el) el.textContent=fmtLoc(m.point); if(marker){marker.setLatLng([m.point.lat,m.point.lng]); map.setView([m.point.lat,m.point.lng]); if(track) track.addLatLng([m.point.lat,m.point.lng]);} }
    else if(m.type==="nearby" && m.sessionId===current){ const t=$("#nearby tbody"); if(t) t.innerHTML=nearbyRows(m.devices); }
    else if(m.type==="audio"){ const s=sessionsCache.find(x=>x.id===m.sessionId); if(s){s.hasAudio=true;} if(m.sessionId===current) loadAudio(current); renderList(); }
    else if(m.type==="video"){ const s=sessionsCache.find(x=>x.id===m.sessionId); if(s){s.hasVideo=true; if(!s.videoFiles) s.videoFiles=[]; if(m.file && !s.videoFiles.includes(m.file)) s.videoFiles.push(m.file);} if(m.sessionId===current) loadVideo(current); renderList(); }
    else if(m.type==="ended"){ if(m.session) upsert(m.session); else{ const s=sessionsCache.find(x=>x.id===m.sessionId); if(s){s.active=false;s.status=m.by==="admin"?"ended by admin":"ended";} } if(m.sessionId===current && room){ try{ room.disconnect(); }catch{} room=null; clearLiveTiles(); } renderList(); if(m.sessionId===current) openSession(current); }
  };
  ws.onclose = ()=> setTimeout(connectWS, 2000);
}
function upsert(s){ const i=sessionsCache.findIndex(x=>x.id===s.id); if(i>=0) sessionsCache[i]=s; else sessionsCache.push(s); }

async function start(){
  try{ await ssosLoadMe(); }catch{ return renderLogin(); }
  renderApp(); if("Notification" in window) Notification.requestPermission();
  const data = await api("/api/sessions"); sessionsCache=data.sessions; renderList(); connectWS();
}
start().catch(()=>renderLogin());
</script>
